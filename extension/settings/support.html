<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="supportProject">捐献支持</title>
  <link rel="stylesheet" href="../js/ui.css">
  <link rel="stylesheet" href="../js/settings.css">
</head>
<body class="settings-page">
  <div class="settings-shell">
    <aside class="settings-sidebar">
      <div class="settings-brand">
        <img src="../icons/icon48.png" width="32" height="32" alt="">
        <div><strong data-i18n="projectName">森页护眼</strong><p data-i18n="advancedSettings">高级设置</p></div>
      </div>
      <nav class="settings-nav" aria-label="设置导航">
        <a href="../options/options.html#filter" data-i18n="settingsFilter">护眼与网站</a>
        <a href="../options/options.html#reminders" data-i18n="restReminder">休息提醒</a>
        <a href="../options/options.html#general" data-i18n="settingsGeneral">快捷键与语言</a>
        <a href="../options/options.html#backup" data-i18n="settingsBackup">备份与恢复</a>
        <a href="settings.html" data-i18n="settingsAbout">关于</a>
      </nav>
    </aside>
    <main class="settings-content">
      <header class="settings-header">
        <h1 data-i18n="supportProject">捐献支持</h1>
        <a class="support-page-link" href="settings.html#feedback" data-i18n="backToFeedback">返回意见反馈</a>
      </header>
      <section class="setting-card">
        <p data-i18n="supportPitch">用得顺手的话，欢迎给森页这片小叶子浇点水。每一份支持，都能给下一次更新添点动力。</p>
        <p class="muted" data-i18n="supportVoluntary">随心支持，森页护眼的所有功能均可免费使用。</p>
        <div class="support-codes">
          <section class="support-code">
            <h2 id="wechatSupport" data-i18n="supportWechat">微信支付</h2>
            <a href="../assets/support-wechat.png" target="_blank" rel="noopener" aria-describedby="wechatSupport">
              <img src="../assets/support-wechat.png" width="1449" height="1715" alt="">
              <span data-i18n="viewSupportCode">查看原图</span>
            </a>
          </section>
          <section class="support-code">
            <h2 id="alipaySupport" data-i18n="supportAlipay">支付宝</h2>
            <a href="../assets/support-alipay.jpg" target="_blank" rel="noopener" aria-describedby="alipaySupport">
              <img src="../assets/support-alipay.jpg" width="1050" height="1575" alt="">
              <span data-i18n="viewSupportCode">查看原图</span>
            </a>
          </section>
        </div>
      </section>
    </main>
  </div>
  <script src="../js/i18n.js"></script>
  <script src="../js/ui.js"></script>
  <script src="support.js"></script>
</body>
</html>
